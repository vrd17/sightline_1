name: Build Android APK

# Builds an installable debug APK in the cloud and attaches it to the run.
# Trigger: push to main, or run manually from the Actions tab.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch manifest, native files & gradle
        run: npm run patch:android

      - name: Bundle MediaPipe for offline use
        run: |
          mkdir -p www/vendor/tasks-vision
          cp -r node_modules/@mediapipe/tasks-vision/wasm www/vendor/tasks-vision/wasm
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs
